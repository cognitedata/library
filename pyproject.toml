[project]
name = "cognite-library"
version = "0.0.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "cognite-sdk>=7,<8",
    "psutil>=5.9",
    "pydantic>=2.12.4,<3.0.0",
    "pytest>=7",
    "python-dotenv>=1",
    "pyyaml>=6",
    "tenacity>=8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "modules/common/cdf_common/functions/contextualization_connection_writer",
    "modules/contextualization/cdf_entity_matching/functions/fn_dm_context_metadata_update",
    "modules/contextualization/cdf_entity_matching/functions/fn_dm_context_timeseries_entity_matching",
    "modules/contextualization/cdf_file_annotation/functions/fn_file_annotation_finalize",
    "modules/contextualization/cdf_file_annotation/functions/fn_file_annotation_launch",
    "modules/contextualization/cdf_file_annotation/functions/fn_file_annotation_prepare",
    "modules/contextualization/cdf_file_annotation/functions/fn_file_annotation_promote",
    "modules/contextualization/cdf_file_annotation/streamlit/file_annotation_dashboard_annotation_quality",
    "modules/contextualization/cdf_file_annotation/streamlit/file_annotation_dashboard_pipeline_health",
    "modules/contextualization/cdf_p_and_id_annotation/functions/fn_dm_context_files_annotation",
    "modules/dashboards/context_quality/functions/context_quality_handler",
    "modules/dashboards/context_quality/streamlit/context_quality_dashboard",
    "modules/solutions/cdf_ai_extractor/functions/fn_ai_property_extractor",
    "modules/sourcesystem/cdf_oid_sync/functions/fn_oid_sync",
    "modules/datamodels/cfihos_oil_and_gas_extension/cfihos_model_config",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF", "C4", "SIM"]
ignore = [
    "E501",  # line too long — address per-file as needed
    "E701",  # multiple statements on one line (colon)
    # Incremental adoption — remove as violations are fixed:
    "S110",  # best-effort side effects in handlers (must not fail the handler)
    "SIM105",  # stylistic; contextlib.suppress vs try/except/pass
    "B019",  # lru_cache on instance methods; review incrementally
    "SIM115",  # long-lived log file handles in CogniteFunctionLogger
    "SIM112",  # CDF function secret env var names use camelCase
    "S311",  # non-cryptographic random for jitter/backoff
    "S112",  # try-except-continue in batch processing loops
    "B027",  # optional hook methods in abstract base classes
    "B023",  # closure over loop variable; review incrementally
    "RUF049",  # dataclass enums; refactor incrementally
    "RUF012",  # mutable class attribute defaults; refactor incrementally
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/*.ipynb" = ["E741", "F401", "F402"]
"modules/sourcesystem/cdf_oid_sync/test_oid_sync.py" = ["E402"]
"tests/**" = ["S101", "S603", "E402"]
"**/test_*.py" = ["S101", "B017", "S105", "S603"]
"**/run_tests.py" = ["S603"]
"modules/common/cdf_project_foundation/scripts/setup_project.py" = ["S603"]
"scripts/**" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: tests that call live external services (skipped without credentials)",
]
