have_fun: false
memory_config:
  disabled: true
code_review:
  # Temporarily disabled: Gemini was re-flooding PRs with recycled false
  # positives despite styleguide Forbidden comments. Re-enable when you want
  # a fresh review pass on substantive code (set disable: false).
  disable: true
  comment_severity_threshold: CRITICAL
  max_review_comments: 1
  pull_request_opened:
    help: false
    summary: false
    code_review: false
    include_drafts: false
ignore_patterns:
  - "**/upload_data/**/*.Manifest.yaml"
  - "**/upload_data/**/*.Manifest.yml"
