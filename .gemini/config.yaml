have_fun: false
memory_config:
  disabled: true
code_review:
  disable: false
  # Keep review on for real bugs, but starve recycled HIGH-as-CRITICAL nits.
  comment_severity_threshold: CRITICAL
  # One finding per pass — forces prioritization over FP floods.
  max_review_comments: 1
  pull_request_opened:
    help: false
    summary: false
    # Auto-review once when the PR opens; prefer not to re-flood on every push.
    # Manual `/gemini review` still works when you want a fresh pass.
    code_review: true
    include_drafts: false
ignore_patterns:
  # Sample-dump upload manifests intentionally hardcode defaults; not Toolkit YAML.
  - "**/upload_data/**/*.Manifest.yaml"
  - "**/upload_data/**/*.Manifest.yml"
