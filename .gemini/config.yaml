have_fun: false
memory_config:
  disabled: true
code_review:
  disable: false
  comment_severity_threshold: HIGH
  # Cap volume so each push does not re-flood the PR with recycled findings.
  max_review_comments: 5
  pull_request_opened:
    help: true
    summary: false
    code_review: true
    include_drafts: false
ignore_patterns: []
