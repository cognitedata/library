have_fun: false
memory_config:
  disabled: true
code_review:
  disable: false
  # Prefer one batch of findings over drip-feeding 1-per-pass.
  comment_severity_threshold: CRITICAL
  max_review_comments: 10
  pull_request_opened:
    help: false
    summary: false
    code_review: true
    include_drafts: false
ignore_patterns:
  # Sample-dump upload manifests intentionally hardcode defaults; not Toolkit YAML.
  - "**/upload_data/**/*.Manifest.yaml"
  - "**/upload_data/**/*.Manifest.yml"
