space: "{{ search_space }}"
externalId: SearchWorkOrder
name: Search work order
description: Search view for WorkOrder. Maps containers only; no implements.
version: "{{ dm_search_version }}"
properties:
  mainAsset:
    name: Main asset
    description: "CONTRACT: Primary tag for this work order."
    container:
      space: "cdf_idm"
      externalId: CogniteMaintenanceOrder
      type: container
    containerPropertyIdentifier: mainAsset
    source:
      space: "{{ search_space }}"
      externalId: SearchTag
      version: "{{ dm_search_version }}"
      type: view

  status:
    name: Status
    description: "CONTRACT: IDM status."
    container:
      space: "cdf_idm"
      externalId: CogniteMaintenanceOrder
      type: container
    containerPropertyIdentifier: status

  type:
    name: Type
    description: "CONTRACT: IDM type."
    container:
      space: "cdf_idm"
      externalId: CogniteMaintenanceOrder
      type: container
    containerPropertyIdentifier: type

  priority:
    name: Priority
    description: "CONTRACT: IDM priority."
    container:
      space: "cdf_idm"
      externalId: CogniteMaintenanceOrder
      type: container
    containerPropertyIdentifier: priority

  name:
    name: Name
    description: "CONTRACT: Display name from CogniteDescribable."
    container:
      space: "cdf_cdm"
      externalId: CogniteDescribable
      type: container
    containerPropertyIdentifier: name

  description:
    name: Description
    description: "CONTRACT: Description from CogniteDescribable."
    container:
      space: "cdf_cdm"
      externalId: CogniteDescribable
      type: container
    containerPropertyIdentifier: description

  workOrderNumber:
    name: Work order number
    description: "SOURCE_SCAFFOLD: Source order number."
    container:
      space: "{{ enterprise_space }}"
      externalId: WorkOrder
      type: container
    containerPropertyIdentifier: workOrderNumber

  assets:
    name: Assets
    description: "CONTRACT: Tags related to this work order."
    container:
      space: "cdf_cdm"
      externalId: CogniteActivity
      type: container
    containerPropertyIdentifier: assets
    source:
      space: "{{ search_space }}"
      externalId: SearchTag
      version: "{{ dm_search_version }}"
      type: view

  operations:
    name: Operations
    description: "Operations whose maintenanceOrder is this work order."
    connectionType: multi_reverse_direct_relation
    source:
      space: "{{ search_space }}"
      externalId: SearchWorkOrderOperation
      version: "{{ dm_search_version }}"
      type: view
    through:
      source:
        space: "{{ search_space }}"
        externalId: SearchWorkOrderOperation
        version: "{{ dm_search_version }}"
        type: view
      identifier: maintenanceOrder

