space: "{{ search_space }}"
externalId: SearchNotification
name: Search notification
description: Search view for Notification. Maps containers only; no implements.
version: "{{ dm_search_version }}"
properties:
  asset:
    name: Asset
    description: "CONTRACT: Tag this notification refers to."
    container:
      space: "cdf_idm"
      externalId: CogniteNotification
      type: container
    containerPropertyIdentifier: asset
    source:
      space: "{{ search_space }}"
      externalId: SearchTag
      version: "{{ dm_search_version }}"
      type: view

  maintenanceOrder:
    name: Maintenance order
    description: "CONTRACT: Linked work order."
    container:
      space: "cdf_idm"
      externalId: CogniteNotification
      type: container
    containerPropertyIdentifier: maintenanceOrder
    source:
      space: "{{ search_space }}"
      externalId: SearchWorkOrder
      version: "{{ dm_search_version }}"
      type: view

  status:
    name: Status
    description: "CONTRACT: IDM status."
    container:
      space: "cdf_idm"
      externalId: CogniteNotification
      type: container
    containerPropertyIdentifier: status

  priority:
    name: Priority
    description: "CONTRACT: IDM priority."
    container:
      space: "cdf_idm"
      externalId: CogniteNotification
      type: container
    containerPropertyIdentifier: priority

  name:
    name: Name
    description: "CONTRACT: Display name from CogniteDescribable."
    container:
      space: "cdf_cdm"
      externalId: CogniteDescribable
      type: container
    containerPropertyIdentifier: name

  description:
    name: Description
    description: "CONTRACT: Description from CogniteDescribable."
    container:
      space: "cdf_cdm"
      externalId: CogniteDescribable
      type: container
    containerPropertyIdentifier: description

  failureModeCode:
    name: Failure mode code
    description: "SOURCE_SCAFFOLD: Failure mode code."
    container:
      space: "{{ enterprise_space }}"
      externalId: Notification
      type: container
    containerPropertyIdentifier: failureModeCode

  detectionMethodCode:
    name: Detection method code
    description: "SOURCE_SCAFFOLD: Detection method code."
    container:
      space: "{{ enterprise_space }}"
      externalId: Notification
      type: container
    containerPropertyIdentifier: detectionMethodCode

