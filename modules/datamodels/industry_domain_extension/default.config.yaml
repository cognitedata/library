# Data model identifiers
enterprise_space: dm_dom_industry
search_space: dm_sol_industry_search
# One instance space for all nodes, edges and records. When the model is installed and
# extended, change or add spaces to match derived-domain usage (site, plant, access
# boundary) — not one space per source system. Search has no instance space.
instance_space: inst_location
enterprise_data_model_external_id: Industry_DOM
enterprise_data_model_name: Industry DM DOM
dm_enterprise_version: v1

# Governance
dataset_external_id: ds_industry_all
dataset_name: Industry domain model
enterprise_location_filter_external_id: loc_industry_all
enterprise_location_filter_name: Industry all locations

# Access groups — persona-led; environment token only here (override per config.<env>.yaml)
# Type tokens: all | dom | sol | pp | wf (dom/sol/wf are template-specific; documented in SPEC §8.8)
# One admin, DOM producer, SOL consumer. pp/wf live in cdf_industry_ingestion.
# Additive to foundation admin_all_* / producer_all_* / consumer_all_* — do not replace them.
admin_group_name: admin_industry_all_dev
dom_producer_group_name: producer_industry_dom_dev
admin_source_id: ${ADMIN_GROUP_SOURCE_ID}
dom_producer_source_id: ${DOM_PRODUCER_GROUP_SOURCE_ID}

# Records
alarm_stream_external_id: pi_all_alarm_event
# Sample/dev default only. Template is fixed at stream creation — set BasicArchive before any non-dev deploy.
alarm_stream_template: ImmutableTestStream
