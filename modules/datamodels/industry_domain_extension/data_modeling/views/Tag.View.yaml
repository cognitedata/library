space: "{{ enterprise_space }}"
externalId: Tag
name: Tag
description: "Enterprise tag view. CONTRACT: implements CogniteAsset; one asset view in this model."
implements:
  - space: cdf_cdm
    externalId: CogniteAsset
    version: v1
    type: view
version: "{{ dm_enterprise_version }}"
properties:
  site:
    name: Site
    description: "SOURCE_SCAFFOLD: Site or plant code. Example: PLANT01."
    container:
      space: "{{ enterprise_space }}"
      externalId: Tag
      type: container
    containerPropertyIdentifier: site

  area:
    name: Area
    description: "SOURCE_SCAFFOLD: Area or process area code. Example: AREA-A."
    container:
      space: "{{ enterprise_space }}"
      externalId: Tag
      type: container
    containerPropertyIdentifier: area

  system:
    name: System
    description: "SOURCE_SCAFFOLD: System or subsystem code. Example: SYS-01."
    container:
      space: "{{ enterprise_space }}"
      externalId: Tag
      type: container
    containerPropertyIdentifier: system

  labels:
    name: Labels
    description: "CONTRACT: Text-based labels (CogniteDescribable.tags). Aliased to labels because the view is named Tag."
    container:
      space: "cdf_cdm"
      externalId: CogniteDescribable
      type: container
    containerPropertyIdentifier: tags

  parent:
    name: Parent
    description: "CONTRACT: Hierarchy parent; sourced to enterprise Tag."
    container:
      space: "cdf_cdm"
      externalId: CogniteAsset
      type: container
    containerPropertyIdentifier: assetHierarchy_parent
    source:
      space: "{{ enterprise_space }}"
      externalId: Tag
      version: "{{ dm_enterprise_version }}"
      type: view

  root:
    name: Root
    description: "CONTRACT: Hierarchy root; sourced to enterprise Tag."
    container:
      space: "cdf_cdm"
      externalId: CogniteAsset
      type: container
    containerPropertyIdentifier: assetHierarchy_root
    source:
      space: "{{ enterprise_space }}"
      externalId: Tag
      version: "{{ dm_enterprise_version }}"
      type: view

  path:
    name: Path
    description: "CONTRACT: Ancestor path; sourced to enterprise Tag for subtree filtering."
    container:
      space: "cdf_cdm"
      externalId: CogniteAsset
      type: container
    containerPropertyIdentifier: assetHierarchy_path
    source:
      space: "{{ enterprise_space }}"
      externalId: Tag
      version: "{{ dm_enterprise_version }}"
      type: view

  pathLastUpdatedTime:
    name: Path last updated time
    description: "CONTRACT: Last time the asset hierarchy path was updated."
    container:
      space: "cdf_cdm"
      externalId: CogniteAsset
      type: container
    containerPropertyIdentifier: assetHierarchy_path_last_updated_time

  children:
    name: Children
    description: "CONTRACT: Tags whose parent is this tag; overrides CogniteAsset.children to the enterprise Tag."
    connectionType: multi_reverse_direct_relation
    source:
      space: "{{ enterprise_space }}"
      externalId: Tag
      version: "{{ dm_enterprise_version }}"
      type: view
    through:
      source:
        space: "{{ enterprise_space }}"
        externalId: Tag
        version: "{{ dm_enterprise_version }}"
        type: view
      identifier: parent

  equipment:
    name: Equipment
    description: "CONTRACT: Equipment whose asset is this tag; overrides CogniteAsset.equipment to the enterprise Equipment."
    connectionType: multi_reverse_direct_relation
    source:
      space: "{{ enterprise_space }}"
      externalId: Equipment
      version: "{{ dm_enterprise_version }}"
      type: view
    through:
      source:
        space: "{{ enterprise_space }}"
        externalId: Equipment
        version: "{{ dm_enterprise_version }}"
        type: view
      identifier: asset

  timeSeries:
    name: Time series
    description: "CONTRACT: Time series linked to this tag; overrides CogniteAsset.timeSeries to the enterprise TimeSeriesData."
    connectionType: multi_reverse_direct_relation
    source:
      space: "{{ enterprise_space }}"
      externalId: TimeSeriesData
      version: "{{ dm_enterprise_version }}"
      type: view
    through:
      source:
        space: "{{ enterprise_space }}"
        externalId: TimeSeriesData
        version: "{{ dm_enterprise_version }}"
        type: view
      identifier: assets

  files:
    name: Files
    description: "CONTRACT: Documents linked to this tag; overrides CogniteAsset.files to the enterprise Document."
    connectionType: multi_reverse_direct_relation
    source:
      space: "{{ enterprise_space }}"
      externalId: Document
      version: "{{ dm_enterprise_version }}"
      type: view
    through:
      source:
        space: "{{ enterprise_space }}"
        externalId: Document
        version: "{{ dm_enterprise_version }}"
        type: view
      identifier: assets

  activities:
    name: Work orders
    description: "CONTRACT: Work orders linked to this tag; overrides CogniteAsset.activities to the enterprise WorkOrder."
    connectionType: multi_reverse_direct_relation
    source:
      space: "{{ enterprise_space }}"
      externalId: WorkOrder
      version: "{{ dm_enterprise_version }}"
      type: view
    through:
      source:
        space: "{{ enterprise_space }}"
        externalId: WorkOrder
        version: "{{ dm_enterprise_version }}"
        type: view
      identifier: assets

