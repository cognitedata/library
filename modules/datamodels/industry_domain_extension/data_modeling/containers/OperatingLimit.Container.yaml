space: "{{ enterprise_space }}"
externalId: OperatingLimit
name: Operating limit
description: >-
  Operating limits for a measured value. Local name/description/aliases on this
  container (same property names as CogniteDescribable) — no implements/requires
  of CogniteDescribable, so queries avoid the CDM Describable join.
usedFor: node
properties:
  name:
    type: { list: false, collation: ucs_basic, type: text }
    nullable: true
    autoIncrement: false
    immutable: false
    name: Name
    description: "SOURCE_SCAFFOLD: Display label for the operating limit. Example: High pressure limit."

  description:
    type: { list: false, collation: ucs_basic, type: text }
    nullable: true
    autoIncrement: false
    immutable: false
    name: Description
    description: "SOURCE_SCAFFOLD: Free-text description of the operating limit. Local property (not CogniteDescribable)."

  aliases:
    type:
      list: true
      collation: ucs_basic
      type: text
      maxListSize: 1000
    nullable: true
    autoIncrement: false
    immutable: false
    name: Aliases
    description: "SOURCE_SCAFFOLD: Alternative names for the operating limit. Local property (not CogniteDescribable)."

  timeSeries:
    type:
      list: false
      type: direct
    nullable: true
    autoIncrement: false
    immutable: false
    name: Time series
    description: "CONTRACT: Direct relation to TimeSeriesData."

  limitHigh:
    type: { list: false, type: float64 }
    nullable: true
    autoIncrement: false
    immutable: false
    name: Limit high
    description: "SOURCE_SCAFFOLD: High operating limit value. Example: 10.5."

  limitLow:
    type: { list: false, type: float64 }
    nullable: true
    autoIncrement: false
    immutable: false
    name: Limit low
    description: "SOURCE_SCAFFOLD: Low operating limit value. Example: 1.0."

  limitHighConsequence:
    type: { list: false, collation: ucs_basic, type: text }
    nullable: true
    autoIncrement: false
    immutable: false
    name: Limit high consequence
    description: "SOURCE_SCAFFOLD: Consequence if high limit is exceeded."

  limitLowConsequence:
    type: { list: false, collation: ucs_basic, type: text }
    nullable: true
    autoIncrement: false
    immutable: false
    name: Limit low consequence
    description: "SOURCE_SCAFFOLD: Consequence if low limit is exceeded."

  limitHighCorrectiveAction:
    type: { list: false, collation: ucs_basic, type: text }
    nullable: true
    autoIncrement: false
    immutable: false
    name: Limit high corrective action
    description: "SOURCE_SCAFFOLD: Corrective action when high limit is exceeded."

  limitLowCorrectiveAction:
    type: { list: false, collation: ucs_basic, type: text }
    nullable: true
    autoIncrement: false
    immutable: false
    name: Limit low corrective action
    description: "SOURCE_SCAFFOLD: Corrective action when low limit is exceeded."

indexes:
  timeSeries:
    indexType: btree
    properties:
      - timeSeries
    cursorable: true

