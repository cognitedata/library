space: "{{ enterprise_space }}"
externalId: Notification
name: Notification
description: Enterprise notification. Extends CogniteNotification.
usedFor: node
properties:
  failureModeCode:
    type: { list: false, collation: ucs_basic, type: text, maxTextSize: 2400 }
    nullable: true
    autoIncrement: false
    immutable: false
    name: Failure mode code
    description: "SOURCE_SCAFFOLD: Failure mode code from the source. Example: FM01."
  detectionMethodCode:
    type: { list: false, collation: ucs_basic, type: text, maxTextSize: 2400 }
    nullable: true
    autoIncrement: false
    immutable: false
    name: Detection method code
    description: "SOURCE_SCAFFOLD: Detection method code from the source. Example: DM01."
constraints:
  requiresCogniteNotification:
    constraintType: requires
    require:
      space: cdf_idm
      externalId: CogniteNotification
      type: container
indexes:
  failureModeCode:
    indexType: btree
    properties:
      - failureModeCode
    cursorable: false

  detectionMethodCode:
    indexType: btree
    properties:
      - detectionMethodCode
    cursorable: false

