name: dq_infrastructure_bootstrap
functionExternalId: dq_infrastructure_bootstrap
description: Run the Data Quality Validation infrastructure bootstrap.
cronExpression: "*/5 * * * *"
authentication:
  clientId: "{{ functionClientId }}"
  clientSecret: "{{ functionClientSecret }}"
# Toolkit substitutes these into Schedule.data (not into the function code bundle settings.yaml).
data:
  dataQualitySpace: "{{ dataQualitySpace }}"
  recordsStreamId: "{{ recordsStreamId }}"
  functionCodeDatasetExternalId: "{{ functionCodeDatasetExternalId }}"
  dataProductExternalId: "{{ dataProductExternalId }}"
  dataProductVersion: "{{ dataProductVersion }}"
