workflow:
  external_id_prefix: dq-shacl
  version: "1"
  task:
    retries: 3
    timeout: 600
    on_failure: abortWorkflow

timeseries_workflow:
  external_id_prefix: dq-ts-shacl
  version: "1"
  task:
    retries: 3
    # Must stay ≤ 900 s — CDF Functions hard-stop at 15 minutes.
    timeout: 900
    on_failure: abortWorkflow

trigger:
  external_id_prefix: dq-shacl-trigger
  batch_size: 10
  batch_timeout: 60

# Values must be literals: Toolkit does not substitute module variables inside
# function code bundles. Overrides from config.<env>.yaml are passed via
# Schedule.data and merged by handler.py at runtime. Keep these aligned with
# default.config.yaml defaults for cdf_dq_runtime.
records:
  space: dataQuality
  stream_id: test_stream_1

config_space: dataQuality
function_code_dataset_external_id: dq_shacl_rules
config_source: dataproduct
data_product_sync_cron: "13 * * * *"

external_dataproducts:
  - external_id: cognite-core-data-quality
    version: "1.0.0"
