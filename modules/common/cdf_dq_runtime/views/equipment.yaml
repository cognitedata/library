view:
  space: {{ schemaSpace }}
  external_id: {{ viewEquipmentExternalId }}
  version: {{ viewVersion }}
instance_spaces:
  - {{ instanceSpace }}
validation:
  auto_load_depth: 2
  verbose: true
partition_count: 10
partition_field: lastUpdatedTime
chunk_size: 100
sync_batch_size: 1000
use_sync_cursor_mode: true
max_concurrent_executions: 1
uniqueness_cron: "0 */4 * * *"
