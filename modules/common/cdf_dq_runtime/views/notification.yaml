view:
  space: {{ secondarySchemaSpace }}
  external_id: {{ viewNotificationExternalId }}
  version: {{ viewVersion }}
instance_spaces:
  - {{ instanceSpace }}
validation:
  auto_load_depth: 2
  verbose: true
partition_count: 10
partition_field: lastUpdatedTime
sync_batch_size: 1000
use_sync_cursor_mode: true
max_concurrent_executions: 1
