name: Toolkit Deploy Prod

on:
  release:
    types:
      - published

concurrency:
  group: toolkit-deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to {{PROD_PROJECT}}
    runs-on: ubuntu-latest
    environment: prod-toolkit-credentials
    env:
      CDF_CLUSTER: ${{ vars.CDF_CLUSTER }}
      CDF_PROJECT: ${{ vars.CDF_PROJECT }}
      LOGIN_FLOW: ${{ vars.LOGIN_FLOW }}
      IDP_TENANT_ID: ${{ vars.IDP_TENANT_ID }}
      IDP_CLIENT_ID: ${{ vars.IDP_CLIENT_ID }}
      ADMIN_SOURCE_ID: ${{ vars.ADMIN_SOURCE_ID }}
      CONSUMER_SOURCE_ID: ${{ vars.CONSUMER_SOURCE_ID }}
      PRODUCER_SOURCE_ID: ${{ vars.PRODUCER_SOURCE_ID }}
      IDP_CLIENT_SECRET: ${{ secrets.IDP_CLIENT_SECRET }}
    steps:
      - name: Enforce release tag pattern
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vX.Y.Z (got: $TAG)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Reject releases not reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Production releases must be published from a commit reachable from main"
            exit 1
          fi

      - name: Remove local .env
        run: rm -f .env

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Cognite Toolkit
        run: pip install "cognite-toolkit=={{TOOLKIT_VERSION}}"

      - name: cdf build
        run: cdf build {{PROD_BUILD_ARGS}}

      - name: cdf deploy --dry-run
        run: cdf deploy --dry-run

      - name: cdf deploy
        run: cdf deploy
