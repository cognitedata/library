name: producer_{{location}}_ep_file_{{sourceSystem}}_{{environment}}
sourceId: {{extractor_group_source_id}}
capabilities:
  - projectsAcl:
      actions: [LIST]
      scope:
        all: {}
  - groupsAcl:
      actions: [LIST]
      scope:
        currentuserscope: {}
  - datasetsAcl:
      actions: [READ]
      scope:
        idScope:
          ids: ["{{dataset}}"]
  - filesAcl:
      actions: [READ, WRITE]
      scope:
        datasetScope:
          ids: ["{{dataset}}"]
  - rawAcl:
      actions: [READ, WRITE, LIST]
      scope:
        tableScope:
          dbsToTables:
            raw_files_{{location}}_{{sourceSystem}}: [] 
  - dataModelInstancesAcl:
      actions: [READ, WRITE, WRITE_PROPERTIES]
      scope:
        spaceIdScope:
          spaceIds: ["{{instanceSpace}}"]
  - extractionPipelinesAcl:
      actions: [READ]
      scope:
        datasetScope:
          ids: ["{{dataset}}"]
  - extractionConfigsAcl:
      actions: [READ]
      scope:
        datasetScope:
          ids: ["{{dataset}}"]
  - extractionRunsAcl:
      actions: [WRITE]
      scope:
        datasetScope:
          ids: ["{{dataset}}"]
