# Files Extractor — configuration variables
# Default example pipeline targets SharePoint Online via the Files Extractor (CDM mode).

# Site/location code, used in externalIds (e.g. ep_files_{{location}}_{{sourceSystem}})
# Populated automatically from the site / location name entered in setup_project.py.
location: ""

# Source system token — the file source this extractor reads from (e.g. sharepoint, fileshare).
# Used in the pipeline externalId (ep_files_{{location}}_{{sourceSystem}}) and in the
# producer group name (producer_{{location}}_ep_file_{{sourceSystem}}_{{environment}}).
# Lowercase, [a-z0-9] only.
sourceSystem: "sharepoint"

# dataSetExternalId for the extraction pipeline and the data set this module deploys
# (Files written by the extractor land here).
# Computed by setup_project.py as ds_files_{location}.
dataset: "ds_files"

# DM space where CogniteFile instances are written — one space per extractor.
# Computed by setup_project.py as inst_{location}_files.
instanceSpace: "inst_files"

# Integration owner (technical contact for the pipeline)
# Populated by setup_project.py wizard.
integration_owner_name: ""
integration_owner_email: ""
integration_owner_send_notification: false

# Data owner (business contact for the data)
# Populated by setup_project.py wizard.
data_owner_name: ""
data_owner_email: ""
data_owner_send_notification: false

# Extractor group source ID — one scoped producer group per extractor.
extractor_group_source_id: ""

# Deployment environment — populated per environment by setup_project.py.
environment: dev
