workflowExternalId: {{ workflow_external_id }}
version: v1
workflowDefinition:
  tasks:
    # Wave 1: RAW → nodes (parallel). Required: run wf_sap_all_to_industry first (not enforced by dependsOn).
    - externalId: tr_pi_all_to_industry_time_series
      type: transformation
      name: Time series
      description: Load TimeSeriesData nodes from PI
      parameters:
        transformation:
          externalId: tr_pi_all_to_industry_time_series
          concurrencyPolicy: fail
      retries: 3
      timeout: 3600
      onFailure: abortWorkflow

    - externalId: tr_pi_all_to_industry_operating_limit
      type: transformation
      name: Operating limit
      description: Load OperatingLimit nodes from PI
      parameters:
        transformation:
          externalId: tr_pi_all_to_industry_operating_limit
          concurrencyPolicy: fail
      retries: 3
      timeout: 3600
      onFailure: abortWorkflow

    # Wave 2: Records service does not validate target nodes — load Tag (SAP) and Wave 1 first.
    # abortWorkflow so a broken sample ingest fails loudly.
    - externalId: {{ alarm_function_external_id }}
      type: function
      name: Alarm event records
      description: Ingest AlarmEvent records from RAW into the alarm stream
      parameters:
        function:
          externalId: {{ alarm_function_external_id }}
          data:
            stream_external_id: {{ alarm_stream_external_id }}
            instance_space: {{ instance_space }}
            enterprise_space: {{ enterprise_space }}
            raw_database: {{ raw_database_pi }}
            raw_table: alarm_event
          isAsyncComplete: false
      retries: 3
      timeout: 3600
      onFailure: abortWorkflow
      dependsOn:
        - externalId: tr_pi_all_to_industry_time_series
        - externalId: tr_pi_all_to_industry_operating_limit
