[project]
name = "fn-pi-all-ingest-alarm-event"
version = "0.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognite-sdk>=7,<9",
    "pydantic>=2.12.4,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
addopts = "-ra"
