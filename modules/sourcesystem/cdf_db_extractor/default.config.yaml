# DB Extractor — configuration variables

# Site/location code, used in externalIds (e.g. ep_asset_{{location}}_{{sourceSystem}}, raw_asset_{{location}}_{{sourceSystem}})
# Populated automatically from the site / location name entered in setup_project.py.
location: ""

# Source system token — the database this extractor reads from (e.g. postgres, mssql, oracle).
# Used in the pipeline externalId (ep_asset_{{location}}_{{sourceSystem}}) and in the
# producer group name (producer_{{location}}_ep_db_{{sourceSystem}}_{{environment}}).
# Lowercase, [a-z0-9] only.
sourceSystem: "postgres"

# DM space where DB extractor instances are written — one space per extractor.
# Computed by setup_project.py as inst_{location}_db.
instanceSpace: "inst_db"
# dataSetExternalId for the extraction pipeline, RAW database, and the data set this
# module deploys. Computed by setup_project.py as ds_db_{location}.
dataset: "ds_db"

# Integration owner (technical contact for the pipeline)
# Populated by setup_project.py wizard.
integration_owner_name: ""
integration_owner_email: ""
integration_owner_send_notification: false

# Data owner (business contact for the data)
# Populated by setup_project.py wizard.
data_owner_name: ""
data_owner_email: ""
data_owner_send_notification: false
# Extractor group source ID — one scoped producer group per extractor.
extractor_group_source_id: ""
# Deployment environment — populated per environment by setup_project.py.
environment: dev
