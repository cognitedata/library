# SAP Extractor — configuration variables

# Site/location code, used in externalIds (e.g. ep_maintenance_{{location}}_{{sourceSystem}}, db_{{location}}_sap)
# Populated automatically from the site / location name entered in setup_project.py.
location: ""

# Source system token — the SAP system this extractor reads from (e.g. sap, s4hana, ecc).
# Used in the pipeline externalId (ep_maintenance_{{location}}_{{sourceSystem}}) and in the
# producer group name (producer_{{location}}_ep_sap_{{sourceSystem}}_{{environment}}).
# Lowercase, [a-z0-9] only.
sourceSystem: "sap"

# DM space where SAP extractor instances are written — one space per extractor.
# Computed by setup_project.py as sp_{location}_sap.
instanceSpace: "sp_sap_instance_space"

# dataSetExternalId for the extraction pipeline, RAW database, and the data set this
# module deploys. Computed by setup_project.py as ds_sap_{location}.
dataset: "ds_sap"

# SAP plant code — used in OData filter expressions (e.g. MaintPlant eq '{{sapPlant}}')
sapPlant: 1000

# Disable SSL verification for the SAP gateway connection.
# Set to true ONLY if the SAP server uses a self-signed certificate that is
# not trusted by the extractor host.
sapDisableSsl: false

# Integration owner (technical contact for the pipeline)
# Populated by setup_project.py wizard.
integration_owner_name: ""
integration_owner_email: ""
integration_owner_send_notification: false

# Data owner (business contact for the data)
# Populated by setup_project.py wizard.
data_owner_name: ""
data_owner_email: ""
data_owner_send_notification: false

# Extractor group source ID — one scoped producer group per extractor.
extractor_group_source_id: ""

# Deployment environment — populated per environment by setup_project.py.
environment: dev
