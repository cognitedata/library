# Scheduled watermark path:
# schedule WorkflowTrigger → wf_discovery_idx_source_index_watermark →
# fn_discovery_idx_build_watermark_incremental (metadata + annotation incremental builds)

# Dedupe: RAW table source_index_state stores CONTENT_HASH per instance.
# Re-index within cooldown_seconds is skipped unless force=True on the handler.

