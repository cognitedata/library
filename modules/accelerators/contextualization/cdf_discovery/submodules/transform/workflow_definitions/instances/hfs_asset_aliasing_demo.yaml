  - id: transform_mu5vo5t0
    kind: transform
    position:
      x: 452
      y: 18
    data:
      label: Extract ISA-style tag tokens from CogniteAsset name via regex
      config: &id006
        execution:
          mode: parallel
        steps:
        - handler_id: trim_whitespace
          trim_whitespace:
            mode: ends_only
          fields:
          - field_name: name
            regex: (?<![\d-])(?:\b|(?<=_))(?:\d{1,8}-?)?[A-Z]{1,8}-?\d{1,10}(?:-\d{1,6})*[A-Z]?\b
          output_field: aliases
          description: Extract ISA-style tag tokens from CogniteAsset name via regex
        - handler_id: heuristic_sampler
          heuristic_sampler:
            on_no_match: keep_working
            samples:
            - 10-P-1234
          output_field: aliases
          fields:
          - field_name: name
          description: Infer tag-like aliases from asset name using heuristic sample
            patterns
        - handler_id: regex_substitution
          trim_whitespace:
            mode: ends_only
          output_field: aliases
          fields:
          - field_name: name
            regex: ''
          regex_substitution:
            patterns:
            - pattern: ^[^-]+-(?=[^ -]+-[^ -])
              replacement: ''
          description: Strip leading unit prefix segment from name before alias merge
        description: Extract ISA-style tag tokens from CogniteAsset name via regex
        field_policies:
        - property: aliases
          strategy: merge_list
          merge_list:
            unique: true
            branch_order: by_score
        - property: unit
          strategy: tie_break
        - property: areaName
          strategy: tie_break
        - property: name
          strategy: tie_break
        - property: areaNumber
          strategy: tie_break
        - property: unitName
          strategy: tie_break
    width: 192
    height: 130
  - id: transform_muef03d7
    kind: transform
    position:
      x: 948
      y: 18
    data:
      label: Append PI Unit to Aliases
      config: &id007
        handler_id: compose_template
        enabled: true
        fields:
        - field_name: aliases
        output_field: aliases
        output_template: '{map_pi_unit}{aliases}'
        output_mode: append
        compose_template:
          iterate_field: aliases
          skip_if:
            operator: STARTS_WITH
            property: map_pi_unit
        output_field_type: list
        description: Compose an output string from a template with list-aware substitution.
          When the iterate field is a list (e.g. aliases), each element is formatted
          individually and the output stays a list. When it is a string (e.g. name),
          the template is applied once and the output stays a string. Use after a
          join to prefix/suffix values with enrichment fields such as pi_unit. Pair
          with output_mode=append to keep originals and add composed variants. skip_if
          STARTS_WITH map_pi_unit avoids duplicating the unit prefix (12PTE3089 stays
          as-is; PTE3089 becomes 12PTE3089).
      node_color: '#db2777'
    width: 192
    height: 130
