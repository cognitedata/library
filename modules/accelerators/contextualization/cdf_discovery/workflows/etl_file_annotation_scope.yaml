schemaVersion: 1
template_id: file_annotation
label: File Annotation
parameters:
  incremental_change_processing: true
  incremental_skip_unchanged: true
  fanout_mode: both
  raw_db: etl_staging
  raw_table_key: cohort
  instance_space: inst_assets
  mime_type: application/pdf
canvas:
  schemaVersion: 1
  handle_orientation: lr
  layout_method: layered
  edge_path_style: default
  nodes:
  - id: completion_barrier
    kind: function_ref
    data:
      label: Detect completion barrier
      config: &id001
        description: Ensure all detect jobs are terminal before downstream mapping
        function_external_id: fn_discovery_etl_file_annotation_barrier
        source_task_id: fanout
    width: 192
    height: 130
  - id: end
    kind: end
    data:
      label: End
      config:
        description: Post-run cohort RAW cleanup
    width: 148
    height: 68
  - id: fanout
    kind: dynamic_fanout
    data:
      label: Dynamic fan-out
      config: &id002
        description: Run diagram pattern detect per page-pack (async tasks)
        generator_task_id: fanout_plan
        child_function_external_id: fn_discovery_etl_file_annotation_launch
        batch_size: 1
    width: 192
    height: 130
  - id: fanout_plan
    kind: workflow_fanout_plan
    data:
      label: Plan detect batches
      config: &id003
        description: Build normalized pattern entities and one dynamic task per detect
          page-pack
        debug_explicit_patterns: true
        fanout_profile: file_annotation
        max_pattern_samples: 100
        pattern_normalization: file_annotation
        child_function_external_id: fn_discovery_etl_file_annotation_launch
        batch_size: 10
        max_pages_per_detect_request: 15
        max_pages_per_file_reference: 50
        min_tokens: 1
        diagram_poll_timeout_sec: 840
        max_detect_jobs_per_invocation: 1
    width: 236
    height: 150
  - id: finalize_annotations
    kind: function_ref
    data:
      label: Finalize detect jobs
      config: &id004
        description: Finalize launched diagram detect jobs in bounded cycles
        function_external_id: fn_discovery_etl_file_annotation_finalize
        source_task_id: fanout
    width: 192
    height: 130
  - id: query_assets
    kind: query_view
    data:
      label: CogniteAsset (aliases)
      config: &id005
        description: Load CogniteAsset aliases for pattern-mode diagram detect entities
        view_space: cdf_cdm
        view_external_id: CogniteAsset
        view_version: v1
        batch_size: 1000
        include_properties:
        - aliases
        query_scope_mode: all
        filters: []
    width: 192
    height: 130
  - id: query_files
    kind: query_view
    data:
      label: CogniteFile (PDFs)
      config: &id006
        description: Files to scan via diagram detect
        view_space: cdf_cdm
        view_external_id: CogniteFile
        view_version: v1
        batch_size: 500
        include_properties:
        - name
        - mimeType
        - pageCount
        query_scope_mode: all
        filters: []
    width: 192
    height: 130
  - id: query_view_mre057x4
    kind: query_view
    data:
      label: CogniteFile (PDFs)
      config: &id007
        description: Files to scan via diagram detect
        view_space: cdf_cdm
        view_external_id: CogniteFile
        view_version: v1
        batch_size: 500
        include_properties:
        - name
        - mimeType
        - pageCount
        query_scope_mode: all
        filters: []
    width: 192
    height: 130
  - id: map_annotations_dm
    kind: json_mapping
    data:
      label: Map annotations (DM)
      config:
        description: Expand file-annotation cohort hits to CogniteDiagramAnnotation
          staging rows
        mapper_kind: diagram_detect_to_dm
        annotation_space: discovery-annotations
        default_status: Suggested
        input: &id008
          rows: ${finalize_annotations.output}
        expression: input.rows
    width: 192
    height: 130
  - id: save_annotation_results_dm
    kind: save_view
    data:
      label: Save CogniteDiagramAnnotation
      config: &id009
        description: Write CogniteDiagramAnnotation edges to the CDF data model
        view_space: cdf_cdm
        view_external_id: CogniteDiagramAnnotation
        view_version: v1
        annotation_space: discovery-annotations
      node_color: '#0d9488'
    width: 192
    height: 130
  - id: start
    kind: start
    data:
      label: Start
      config:
        workflow_base: wf_all_wf_discovery_etl_file_annotation
        workflow_external_id: wf_all_wf_discovery_etl_file_annotation
        trigger_external_id: trg_wf_all_wf_discovery_etl_file_annotation
        workflow_version: '1'
        incremental_change_processing: true
    width: 148
    height: 68
  edges:
  - id: edge_start_query
    source: start
    target: query_assets
    source_handle: out
    target_handle: in
    kind: data
  - id: edge_start_query_files
    source: start
    target: query_files
    source_handle: out
    target_handle: in
    kind: data
  - id: edge_query_plan
    source: query_assets
    target: fanout_plan
    source_handle: out
    target_handle: in__input_a
    kind: data
  - id: edge_files_plan
    source: query_files
    target: fanout_plan
    source_handle: out
    target_handle: in__input_b
    kind: data
  - id: edge_plan_fanout
    source: fanout_plan
    target: fanout
    source_handle: out
    target_handle: in
    kind: data
  - id: edge_fanout_finalize
    source: fanout
    target: finalize_annotations
    source_handle: out
    target_handle: in
    kind: data
  - id: edge_finalize_barrier
    source: finalize_annotations
    target: completion_barrier
    source_handle: out
    target_handle: in
    kind: data
  - id: edge_barrier_map_dm
    source: completion_barrier
    target: map_annotations_dm
    source_handle: out
    target_handle: in
    kind: data
  - id: edge_map_dm_save
    source: map_annotations_dm
    target: save_annotation_results_dm
    source_handle: out
    target_handle: in
    kind: data
  - id: edge_save_dm_end
    source: save_annotation_results_dm
    target: end
    source_handle: out
    target_handle: in
    kind: data
  - id: xy-edge__query_view_mre057x4out-fanout_planin__input_a
    source: query_view_mre057x4
    target: fanout_plan
    source_handle: out
    target_handle: in__input_a
    kind: data
  - id: xy-edge__startout-query_view_mre057x4in
    source: start
    target: query_view_mre057x4
    source_handle: out
    target_handle: in
    kind: data
  viewport:
    x: -1147.436603475931
    y: 214.38071160513255
    zoom: 1.0086199233232962
compiled_workflow:
  schema_version: 1
  tasks:
  - id: completion_barrier
    function_external_id: fn_discovery_etl_file_annotation_barrier
    executable_kind: function_ref
    task_type: function
    canvas_node_id: completion_barrier
    label: Detect completion barrier
    depends_on:
    - finalize_annotations
    payload:
      config: *id001
  - id: fanout
    function_external_id: null
    executable_kind: dynamic_fanout
    task_type: dynamic
    canvas_node_id: fanout
    label: Dynamic fan-out
    depends_on:
    - fanout_plan
    payload:
      config: *id002
  - id: fanout_plan
    function_external_id: fn_discovery_etl_fanout_plan
    executable_kind: workflow_fanout_plan
    task_type: function
    canvas_node_id: fanout_plan
    label: Plan detect batches
    depends_on:
    - query_assets
    - query_files
    - query_view_mre057x4
    payload:
      config: *id003
      input_a_task_id: query_assets
      input_a_task_ids:
      - query_assets
      - query_view_mre057x4
      input_b_task_id: query_files
      fanout_profile: file_annotation
  - id: finalize_annotations
    function_external_id: fn_discovery_etl_file_annotation_finalize
    executable_kind: function_ref
    task_type: function
    canvas_node_id: finalize_annotations
    label: Finalize detect jobs
    depends_on:
    - fanout
    payload:
      config: *id004
  - id: query_assets
    function_external_id: fn_discovery_etl_view_query
    executable_kind: query_view
    task_type: function
    canvas_node_id: query_assets
    label: CogniteAsset (aliases)
    depends_on: []
    payload:
      config: *id005
  - id: query_files
    function_external_id: fn_discovery_etl_view_query
    executable_kind: query_view
    task_type: function
    canvas_node_id: query_files
    label: CogniteFile (PDFs)
    depends_on: []
    payload:
      config: *id006
  - id: query_view_mre057x4
    function_external_id: fn_discovery_etl_view_query
    executable_kind: query_view
    task_type: function
    canvas_node_id: query_view_mre057x4
    label: CogniteFile (PDFs)
    depends_on: []
    payload:
      config: *id007
  - id: map_annotations_dm
    function_external_id: null
    executable_kind: json_mapping
    task_type: jsonMapping
    canvas_node_id: map_annotations_dm
    label: Map annotations (DM)
    depends_on:
    - completion_barrier
    payload:
      config:
        description: Expand file-annotation cohort hits to CogniteDiagramAnnotation
          staging rows
        mapper_kind: diagram_detect_to_dm
        annotation_space: discovery-annotations
        default_status: Suggested
        input: *id008
        expression: input.rows
      source_task_id: completion_barrier
  - id: save_annotation_results_dm
    function_external_id: fn_discovery_etl_view_save
    executable_kind: save_view
    task_type: function
    canvas_node_id: save_annotation_results_dm
    label: Save CogniteDiagramAnnotation
    depends_on:
    - map_annotations_dm
    payload:
      config: *id009
  - id: end
    function_external_id: fn_discovery_etl_raw_cleanup
    executable_kind: raw_cleanup
    task_type: function
    canvas_node_id: end
    depends_on:
    - save_annotation_results_dm
    payload:
      config:
        description: Post-run cohort RAW cleanup
id: file_annotation
