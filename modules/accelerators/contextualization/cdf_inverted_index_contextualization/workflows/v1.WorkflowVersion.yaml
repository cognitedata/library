workflowExternalId: wf_idx_target_driven_incremental
version: v1
workflowDefinition:
  description: >-
    Invoke fn_idx_handle_subscription with workflow trigger items (dataModeling batch).
  tasks:
    - externalId: fn_idx_handle_subscription
      type: function
      parameters:
        function:
          externalId: fn_idx_handle_subscription
          data:
            items: '${workflow.input.items}'
      name: Target-driven subscription handler
      description: Map workflow items to subscription events and run target-driven contextualization
      retries: 3
      timeout: 3600
      onFailure: abortWorkflow
