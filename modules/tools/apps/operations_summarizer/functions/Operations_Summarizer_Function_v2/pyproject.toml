[project]
name = "operations-summarizer-function"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cognite-sdk>=7,<8",
    "reportlab>=4,<5",
    "python-dotenv>=1.2,<2",
    "requests>=2.32,<3",
    "edge-tts>=7,<8",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
addopts = "-ra"
