# The weekly full run: every slice is counted again, which makes everything exact (README, "Running incrementally"). The
# daily run is context_quality.WorkflowTrigger.yaml, which leaves out this one's day (Sunday): keep the two schedules
# apart, as the workflow runs one execution at a time. To switch this run off, pause or delete the trigger in the CDF UI,
# or remove this file and set metricsWorkflowSchedule back to "0 4 * * *".
externalId: "{{ metricsFullTriggerExternalId }}"
triggerRule:
  triggerType: schedule
  cronExpression: "{{ metricsFullWorkflowSchedule }}"
  timezone: "{{ metricsWorkflowScheduleTimezone }}"
workflowExternalId: "{{ metricsWorkflowExternalId }}"
workflowVersion: "{{ metricsWorkflowVersion }}"
# the workflow reads extraLinks from its input; a scheduled run has no config file, so it passes none
# and every dimension, no configured links (see README, "Running some dimensions only"). This trigger is the weekly full
# run: every slice is counted again, which makes everything exact (README, "Running incrementally"). The daily run is
# context_quality.WorkflowTrigger.yaml. Keep the two schedules apart: the workflow runs one execution at a time.
input:
  extraLinks: []
  scope: all
  mode: full
# The identity the scheduled run executes as. It must be a member of the function group (auth/), whose source id is
# metricsFunctionGroupSourceId. These come from the environment; nothing is stored in this repository.
authentication:
  clientId: "{{ metricsFunctionClientId }}"
  clientSecret: "{{ metricsFunctionClientSecret }}"
