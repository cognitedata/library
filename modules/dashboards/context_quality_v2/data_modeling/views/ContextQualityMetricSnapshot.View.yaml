space: "{{ metricsSchemaSpace }}"
externalId: "{{ snapshotViewExternalId }}"
version: "{{ metricsVersion }}"
name: Context Quality Metric Snapshot
description: >
  Read surface for historical trend points. Bound to the
  context_quality_metric_snapshots stream via streamId. The Flow app sums
  eligibleCount/passingCount/valueSum across matching rows for a given run to build a
  trend point at a rolled-up scope. See the module README for the mandatory
  lastUpdatedTime range on filter/aggregate calls, the "fetch latest run" pattern, and
  why every run must write a complete regeneration of current state here.
streamId: "{{ snapshotStreamExternalId }}"
properties:
  runId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: runId
    description: Correlates every snapshot written by a single dashboard run
    name: Run ID
  runTimestamp:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: runTimestamp
    description: When the run that produced this snapshot executed (SnapshotPointDto.capturedAt)
    name: Run timestamp
  dimensionId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: dimensionId
    description: One of the 7 quality dimensions (§4.1 / §9)
    name: Dimension ID
  recordKind:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: recordKind
    description: "aggregate | exclusionCount"
    name: Record kind
  metricId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: metricId
    description: Which §9 metric this snapshot is for, when recordKind is aggregate
    name: Metric ID
  reportingUnitId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: reportingUnitId
    description: The lowest-grain identifier this snapshot was captured at — not necessarily equal to facilityId
    name: Reporting unit ID
  disciplineId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: disciplineId
    description: Non-null only when this count was produced at discipline granularity
    name: Discipline ID
  ownerId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: ownerId
    description: Non-null only when this count was produced at owner granularity
    name: Owner ID
  tier:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: tier
    description: Null means untiered — never present alongside per-tier rows for the same key
    name: Tier
  facilityId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: facilityId
    description: Denormalized, descriptive only
    name: Facility ID
  divisionId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: divisionId
    description: Denormalized, descriptive only
    name: Division ID
  eligibleCount:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: eligibleCount
    description: Raw denominator at this reporting unit and run — sum across rows to roll up
    name: Eligible count
  passingCount:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: passingCount
    description: Raw numerator, for ratio-shaped metrics only
    name: Passing count
  issueCount:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: issueCount
    description: Raw issue count, where applicable
    name: Issue count
  valueSum:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: valueSum
    description: Sum of underlying values, for average-shaped metrics only — average = ΣvalueSum ÷ ΣeligibleCount
    name: Value sum
  exclusionCategory:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: exclusionCategory
    description: Which §6.1 default or §6.2 user-configured exclusion rule this count is for
    name: Exclusion category
  excludedCount:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ snapshotContainerExternalId }}"
      type: container
    containerPropertyIdentifier: excludedCount
    description: Count of entities excluded under exclusionCategory at this reporting unit and run
    name: Excluded count
