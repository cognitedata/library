space: "{{ metricsSchemaSpace }}"
externalId: "{{ currentMetricViewExternalId }}"
version: "{{ metricsVersion }}"
name: Context Quality Current Metric
description: >
  Read surface for current raw counts at the lowest reporting level. A normal mutable
  node view — not stream-backed — so it uses standard list/filter with cursor
  pagination. The Flow app sums eligibleCount/passingCount across all matching rows
  for the active scope and derives percent itself; it must not read valuePercent for
  anything other than a single row's own reportingUnitId.
properties:
  metricId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: metricId
    description: Which §9 metric this is
    name: Metric ID
  dimensionId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: dimensionId
    description: One of the 7 quality dimensions (§4.1 / §9)
    name: Dimension ID
  reportingUnitId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: reportingUnitId
    description: >
      The lowest-grain identifier the backend read this count at (a unit, plant, or
      facility — whatever that view supports). Part of this node's externalId, together
      with metricId and tier. Not necessarily equal to facilityId.
    name: Reporting unit ID
  labelKey:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: labelKey
    description: i18n label key for the metric
    name: Label key
  direction:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: direction
    description: "critical | informational"
    name: Direction
  eligibleCount:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: eligibleCount
    description: Raw denominator at this reporting unit — sum across rows to roll up to a wider scope
    name: Eligible count
  passingCount:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: passingCount
    description: Raw numerator at this reporting unit — sum across rows to roll up to a wider scope
    name: Passing count
  issueCount:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: issueCount
    description: Raw issue count at this reporting unit — sum across rows to roll up to a wider scope
    name: Issue count
  valuePercent:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: valuePercent
    description: >
      Convenience value for this single reportingUnitId only. Never sum or average
      across rows — recompute passingCount/eligibleCount sums for any rolled-up scope.
    name: Value percent
  tier:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: tier
    description: "Null represents AggregateMetricRowDto.tier === 'all'"
    name: Tier
  extended:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: extended
    description: Whether this is an extended/optional metric
    name: Extended
  hasDrilldown:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: hasDrilldown
    description: Whether a ContextQualityDrilldownRow list exists for this metric
    name: Has drilldown
  actionKey:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: actionKey
    description: i18n key for the suggested action
    name: Action key
  status:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: status
    description: "good | weak | critical, computed for this reportingUnitId's own valuePercent"
    name: Status
  facilityId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: facilityId
    description: Denormalized hierarchy field for filtering/rollup (SliceFilters.facilityId) — not part of the row's identity
    name: Facility ID
  divisionId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: divisionId
    description: Denormalized hierarchy field for filtering/rollup (SliceFilters.divisionId) — not part of the row's identity
    name: Division ID
  disciplineId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: disciplineId
    description: Denormalized hierarchy field for filtering/rollup (SliceFilters.disciplineId) — not part of the row's identity
    name: Discipline ID
  ownerId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: ownerId
    description: >
      Best-effort only — owner is typically derived via prefix/path mapping
      (OwnerMappingDto), not a native property of a reporting unit. Do not treat
      owner-scoped sums over this field as authoritative until resolved (open question).
    name: Owner ID
  lastRunId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: lastRunId
    description: Which run last computed this value
    name: Last run ID
  lastUpdatedAt:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: lastUpdatedAt
    description: When lastRunId last computed this value
    name: Last updated at
