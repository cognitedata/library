space: "{{ metricsSchemaSpace }}"
externalId: "{{ currentMetricViewExternalId }}"
version: "{{ metricsVersion }}"
name: Context Quality Current Metric
description: >
  Read surface for current raw counts. A normal mutable node view — not stream-backed
  — so it uses standard list/filter with cursor pagination. The Flow app computes
  both a metric card's own percent and any rolled-up scope from eligibleCount/
  passingCount/valueSum; this view stores no precomputed percent or display fields.
properties:
  metricId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: metricId
    description: Which §9 metric this is (or custom:<ruleId> for a customer-defined rule — see README)
    name: Metric ID
  dimensionId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: dimensionId
    description: One of the 7 quality dimensions (§4.1 / §9)
    name: Dimension ID
  reportingUnitId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: reportingUnitId
    description: >
      The lowest-grain identifier the backend read this count at (a unit, plant, or
      facility — whatever that view supports). Part of this node's externalId.
    name: Reporting unit ID
  disciplineId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: disciplineId
    description: >
      Part of this node's externalId when non-null. Null means the function could not
      break this count out by discipline; non-null means this row covers only that
      one discipline within reportingUnitId.
    name: Discipline ID
  ownerId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: ownerId
    description: >
      Part of this node's externalId when non-null. Owner is typically derived via
      prefix/path mapping, not a native property — only set when the function could
      resolve it per-entity at count time.
    name: Owner ID
  tier:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: tier
    description: >
      Part of this node's externalId. Null means this metric/unit is untiered — never
      present alongside per-tier (1/2/3) rows for the same
      (metricId, reportingUnitId, disciplineId, ownerId).
    name: Tier
  facilityId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: facilityId
    description: Denormalized, descriptive only — not part of this node's identity
    name: Facility ID
  divisionId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: divisionId
    description: Denormalized, descriptive only — not part of this node's identity
    name: Division ID
  eligibleCount:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: eligibleCount
    description: Denominator for ratio metrics, and the N to divide valueSum by for average metrics
    name: Eligible count
  passingCount:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: passingCount
    description: Numerator, for ratio-shaped metrics only (null for average-shaped metrics)
    name: Passing count
  issueCount:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: issueCount
    description: Broken-item count, where applicable
    name: Issue count
  valueSum:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: valueSum
    description: >
      Sum of the underlying values, for average-shaped metrics only (e.g. Average
      Depth, Average Children, average annotation confidence). Average = ΣvalueSum ÷
      ΣeligibleCount, summed across matching rows for whatever scope is selected.
    name: Value sum
  lastRunId:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: lastRunId
    description: Which run last computed this value
    name: Last run ID
  lastUpdatedAt:
    container:
      space: "{{ metricsSchemaSpace }}"
      externalId: "{{ currentMetricContainerExternalId }}"
      type: container
    containerPropertyIdentifier: lastUpdatedAt
    description: When lastRunId last computed this value
    name: Last updated at
