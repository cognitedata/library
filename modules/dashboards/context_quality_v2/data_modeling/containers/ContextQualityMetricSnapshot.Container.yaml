space: "{{ metricsSchemaSpace }}"
externalId: "{{ snapshotContainerExternalId }}"
usedFor: record
name: Context Quality Metric Snapshot
description: >
  One immutable historical trend point per run, per lowest-reporting-level unit —
  never a precomputed value for a filter-combination scope. Per the 2026-10-07 backend
  design call, the backend only ever writes raw counts at the lowest level it can read
  (e.g. a unit, not a whole facility, when the source view supports that granularity);
  the Flow app sums eligibleCount/passingCount across matching reportingUnitId rows for
  a given run/timestamp to build a trend line at any rolled-up scope. recordKind
  selects between a per-tier dimension aggregate and a §6.1/§6.2 excluded-content
  count. This container exists only for genuine history/trending — the live "right
  now" value is served by the mutable ContextQualityCurrentMetric node container
  instead, since that doesn't need history. Record containers do not support indexes
  or constraints.
