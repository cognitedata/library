space: "{{ metricsSchemaSpace }}"
externalId: "{{ snapshotContainerExternalId }}"
usedFor: record
name: Context Quality Metric Snapshot
description: >
  One immutable historical trend point per run, at the same grain as
  ContextQualityCurrentMetric: (metricId, reportingUnitId, disciplineId, ownerId,
  tier) for an aggregate record, or (dimensionId, exclusionCategory, reportingUnitId,
  disciplineId, ownerId) for an exclusionCount record — see that container's
  description for why disciplineId/ownerId are only non-null when the count was
  actually produced at that granularity, and why tier is never mixed (null vs. 1/2/3)
  for the same key.
  Every field here is required to be non-null where the equivalent field is required
  on ContextQualityCurrentMetric (reportingUnitId in particular — a snapshot without
  a reporting unit cannot be summed correctly).
  The Flow app sums eligibleCount/passingCount/valueSum across matching rows for a
  given run to build a trend point at any rolled-up scope. This only produces a
  correct trend if every run writes a COMPLETE regeneration of every current
  combination, not just the ones that changed since the last run — a partial write
  would understate that run's sum and the trend line would show a drop that didn't
  happen. The backend function may read incrementally, but every run must still
  regenerate the full current-state snapshot from ContextQualityCurrentMetric before
  appending it here. See the module README for the sizing implications of this at
  different run frequencies.
  Record containers do not support indexes or constraints.
