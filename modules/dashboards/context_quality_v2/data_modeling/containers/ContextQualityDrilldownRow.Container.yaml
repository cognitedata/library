space: "{{ metricsSchemaSpace }}"
externalId: "{{ drilldownRowContainerExternalId }}"
usedFor: node
name: Context Quality Drilldown Row
description: >
  One row per currently-broken entity named in a §9 drill-down list (e.g. an orphaned Tier
  1 asset, a low-confidence annotation) — parity with the Flow app's DrilldownRowDto/
  IssueDto (src/types/dto.ts). Already entity-level raw data, so it is unaffected by the
  "lowest reporting level, app aggregates" correction applied to ContextQualityCurrentMetric
  and ContextQualityMetricSnapshot — an individual entity is the finest possible grain.
  Immutability is not needed here: the product need is "what's broken right now," not a
  history of every past run's backlog, and immutable Records & Streams containers cannot be
  deleted from once written. This container is upserted every run: a node's externalId is
  deterministic from (metricId, entityId) — entityId, not entityLabel or entityRef, is the
  stable identity, since labels can change and entityRef may be absent. A still-broken
  entity's row is overwritten in place; a fixed entity's row is deleted; size tracks the
  current backlog, never the run count. lastSeenRunId/lastSeenTimestamp record which run
  last confirmed a row, without retaining prior runs' versions of it.
