space: "{{ metricsSchemaSpace }}"
externalId: "{{ currentMetricContainerExternalId }}"
usedFor: node
name: Context Quality Current Metric
description: >
  The current raw numbers for one metric at the actual grain the backend function
  counted it at. A row's grain is (metricId, reportingUnitId, disciplineId, ownerId,
  tier): reportingUnitId is the lowest area the function could read the metric at (a
  unit, a plant, or a facility); disciplineId/ownerId are only non-null when the
  function could determine them per-entity at count time, since a single reporting
  unit commonly contains more than one discipline — a row cannot claim a single
  discipline/owner value unless the counts were actually produced at that
  granularity. Only combinations that exist in the data get rows (not a cross
  product). tier is null for an untiered count; see the tiering rule below for why a
  unit/metric never has both a null-tier row and per-tier rows at the same time.
  facilityId/divisionId are coarser than reportingUnitId and are denormalized,
  descriptive-only fields (every reporting unit sits inside exactly one facility/
  division, so these never need to be part of the key).
  eligibleCount is the denominator for both ratio metrics (eligible/passing/issue) and
  average metrics (eligibleCount/valueSum, e.g. Average Depth = sum of depth values
  divided by eligibleCount). passingCount/issueCount/valueSum are each only populated
  for the metric shapes they apply to.
  No display-only fields (label, action key, direction, status) are stored here —
  those are static per metricId and already live in the Flow app's own metric
  catalog; repeating them per row would drift from that catalog. No valuePercent is
  stored either: it is fully derivable from the counts above, and storing it invited
  being read directly for a rolled-up scope where it would be wrong.
  Upserted every run: a node's externalId is deterministic from
  (metricId, reportingUnitId, disciplineId, ownerId, tier), so a re-run for the same
  key overwrites the previous value in place rather than accumulating history.
  History lives separately in the immutable ContextQualityMetricSnapshot record
  container, which must be regenerated in full (every current combination) on every
  run — not just the combinations that changed — since a snapshot run's rows are
  summed together to build one trend point, and a partial write would understate it.
