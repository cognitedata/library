space: "{{ metricsSchemaSpace }}"
externalId: "{{ currentMetricContainerExternalId }}"
usedFor: node
name: Context Quality Current Metric
description: >
  The current raw count for one metric at the lowest reporting level the backend
  function can read it at (e.g. a unit, not a whole facility, when the source view
  supports that granularity). The raw data lives here; the scope-specific calculation
  happens in the Flow app at read time. This container does NOT store a
  precomputed value per filter combination (facility+division+owner, etc.) — there is
  no such thing as "the value for this scope" stored here. The Flow app computes any
  rolled-up value by summing eligibleCount/passingCount across every row whose
  facilityId/divisionId/disciplineId matches the active filter, then deriving percent
  from those sums. valuePercent on this container is only trustworthy for this row's
  own reportingUnitId — never sum or average it across rows.
  Upserted every run: a node's externalId is deterministic from
  (metricId, reportingUnitId, tier), so a re-run for the same metric/unit/tier
  overwrites the previous value in place rather than accumulating history. History
  lives separately in the immutable ContextQualityMetricSnapshot record container.
