[project]
name = "fn-dm-context-timeseries-entity-matching"
version = "0.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognite-extractor-utils>=7",
    "cognite-sdk>=7,<8",
    "pyyaml>=6.0.1",
    "tenacity>=8.0.0",
    "psutil>=5.9.0",
    "mixpanel>=4.10.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
addopts = "-ra"
