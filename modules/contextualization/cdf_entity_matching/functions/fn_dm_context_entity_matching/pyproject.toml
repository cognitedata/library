[project]
name = "fn-dm-context-entity-matching"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cognite-extractor-utils>=7,<8",
    "cognite-sdk>=7,<8",
    "pydantic>=2,<3",
    "pyyaml>=6.0.1,<7",
    "tenacity>=8.0.0,<10",
    "mixpanel>=4.10.0,<6",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
addopts = "-ra"
