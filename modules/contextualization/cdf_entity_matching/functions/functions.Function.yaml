# The directory with the function code should have the same name
# and externalId as the function itself as defined below.
- name: 'dm:context:timeseries:entity_matching'
  externalId: 'fn_dm_context_timeseries_entity_matching'
  owner: 'Anonymous'
  description: 'Contextualization of P&ID files creating annotations in Data model'
  space: {{ functionSpace }}
  metadata:
    version: '{{function_version}}'
  envVars:
    # The below two environment variables are set by the Toolkit
    ENV_TYPE: '${CDF_BUILD_TYPE}'
    CDF_ENV: '${CDF_ENVIRON}'
  # Number of cores, not available in Azure
  runtime: 'py313'
  functionPath: 'handler.py'
- name: 'dm:context:entity_matching:submit'
  externalId: 'fn_dm_context_entity_matching_submit'
  owner: 'Anonymous'
  description: 'Apply manual and rule based matching, then start the CDF entity matching predict job'
  space: {{ functionSpace }}
  metadata:
    version: '{{function_version}}'
  envVars:
    # The below two environment variables are set by the Toolkit
    ENV_TYPE: '${CDF_BUILD_TYPE}'
    CDF_ENV: '${CDF_ENVIRON}'
  # Number of cores, not available in Azure
  runtime: 'py313'
  functionPath: 'handler.py'
- name: 'dm:context:entity_matching:collect'
  externalId: 'fn_dm_context_entity_matching_collect'
  owner: 'Anonymous'
  description: 'Collect finished entity matching predict jobs and write the matches to RAW and the data model'
  space: {{ functionSpace }}
  metadata:
    version: '{{function_version}}'
  envVars:
    # The below two environment variables are set by the Toolkit
    ENV_TYPE: '${CDF_BUILD_TYPE}'
    CDF_ENV: '${CDF_ENVIRON}'
  # Number of cores, not available in Azure
  runtime: 'py313'
  functionPath: 'handler.py'
- name: 'dm:context:aliases_update'
  externalId: 'fn_dm_context_aliases_update'
  owner: 'Anonymous'
  description: 'Update aliases for timeseries and assets as prep for entity matching'
  space: {{ functionSpace }}
  metadata:
    version: '{{function_version}}'
  envVars:
    # The below two environment variables are set by the Toolkit
    ENV_TYPE: '${CDF_BUILD_TYPE}'
    CDF_ENV: '${CDF_ENVIRON}'
  # Number of cores, not available in Azure
  runtime: 'py313'
  functionPath: 'handler.py'
