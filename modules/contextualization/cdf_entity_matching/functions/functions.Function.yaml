# The directory with the function code should have the same name
# and externalId as the function itself as defined below.
- name: 'Entity matching submit and collect'
  externalId: 'fn_dm_context_entity_matching'
  owner: '{{ functionOwner }}'
  description: 'Submit entity matching predict jobs and collect their results (data.stage selects submit or collect)'
  space: {{ functionSpace }}
  metadata:
    version: '{{function_version}}'
  envVars:
    # The below two environment variables are set by the Toolkit
    ENV_TYPE: '${CDF_BUILD_TYPE}'
    CDF_ENV: '${CDF_ENVIRON}'
  runtime: 'py313'
  functionPath: 'handler.py'
- name: 'Aliases update'
  externalId: 'fn_dm_context_aliases_update'
  owner: '{{ functionOwner }}'
  description: 'Update aliases for timeseries and assets as prep for entity matching'
  space: {{ functionSpace }}
  metadata:
    version: '{{function_version}}'
  envVars:
    # The below two environment variables are set by the Toolkit
    ENV_TYPE: '${CDF_BUILD_TYPE}'
    CDF_ENV: '${CDF_ENVIRON}'
  runtime: 'py313'
  functionPath: 'handler.py'
