function_version: v1.0.0
# Team or person that owns the functions, shown in CDF
functionOwner: cdf_entity_matching
dbName: db_asset_entity_matching
contextualizationId: entity_matcher
contextualizationName: Entity Matcher
# Matching views: CogniteAsset and CogniteTimeSeries in cdf_cdm. Point these at your
# enterprise views when you do not match against CDM directly.
schemaSpace: cdf_cdm
viewVersion: v1
assetInstanceSpace: inst_location
timeseriesInstanceSpace: inst_location
fileInstanceSpace: inst_location
functionSpace: sp_entity_matching_fn # space where function code nodes are stored — created by this module
# Used only after testing/apply_scoped_matching.py copies the test-only scope model
# into this module. Harmless when those files are not present.
scopeSchemaSpace: sp_entity_matching_scope
scopeDmVersion: v1
scopeDataModelExternalId: EntityMatchingScope_SOL
assetViewExternalId: CogniteAsset
timeseriesViewExternalId: CogniteTimeSeries
# Files stay on CDM; aliases update uses fileSchemaSpace so it is not tied to asset/ts views.
fileSchemaSpace: cdf_cdm
fileViewExternalId: CogniteFile
targetViewExternalId: CogniteAsset
entityViewExternalId: CogniteTimeSeries
targetViewSearchProperty: name
# Property entity matching filters on, applied only when the filter values below are set.
# NOTE: in CFIHOS example data model (dm_dom_oil_and_gas.DataModel.yaml) it is labels
viewFilterProperty: tags
# Regexes that find the tag inside a name, per view. List as many as the view's names
# need; each contributes an alias built from its capture groups joined by "_", so
# VAL_23-KA-9101 gives 23_KA_9101. Two rules when changing these:
#   - Write character classes, not backslash escapes: use [0-9] rather than \d. Toolkit
#     substitutes variables as a regex replacement, where a backslash escape fails the build.
#   - Keep "_" among the accepted separators. That is how the function recognizes the
#     aliases it generated earlier and rebuilds them when updateAll is set, rather than
#     leaving a stale alias behind.
# Each view also has its own AliasSelection, deciding what to keep when several of its
# patterns match one name: 'all' for one alias per matching pattern, or 'longest' for
# only the longest - the most specific reading of the name.
timeseriesAliasPattern:
  - '([0-9]{2}[-_.:][A-Z]{2,4}[-_.:][0-9]{4,5}[A-Z][-_][A-Z]{1,3})'
  - '([0-9]{2}[-_.:][A-Z]{2,4}[-_.:][0-9]{4,5}[-_][A-Z]{1,3})'
  - '([0-9]{2}[-_.:][A-Z]{2,4}[-_.:][0-9]{4,5})'

timeseriesAliasSelection: longest
assetAliasPattern:
  - '([A-Z]{2,4}[-_.:][0-9]{4,5})'
  - '([0-9]{2}[-_.:][A-Z]{2,4}[-_.:][0-9]{4,5}[A-Z][-_][A-Z]{1,3})'
  - '([0-9]{2}[-_.:][A-Z]{2,4}[-_.:][0-9]{4,5}[-_][A-Z]{1,3})'
  - '([0-9]{2}[-_.:][A-Z]{2,4}[-_.:][0-9]{4,5})'

assetAliasSelection: all
# Files also get their file name without the extension as an alias, but only when a
# pattern also matches. A name that matches no pattern produces no alias.
# Separators in a captured group are rewritten to "_", same as equipment tags.
# PH-25578-P-4110006-001.pdf gives PH_25578_P_4110006_001 (from the first
# pattern, and from the file name) and PH_25578_P_4110006 (from the second, whose sheet
# number is outside the group and optional, so the shortened alias is still recognized as
# generated later). (?<![A-Z]) stops a longer prefix matching from its second letter,
# which would write a truncated alias. Keep "_" among the separators so updateAll still
# recognises aliases this function wrote.
fileAliasPattern:
  - '(?<![A-Z])([A-Z]{2,4}[-_][A-Z0-9]+[-_][A-Z][-_][0-9]+[-_][0-9]+)'
  - '(?<![A-Z])([A-Z]{2,4}[-_][A-Z0-9]+[-_][A-Z][-_][0-9]+)(?=[-_][0-9]+)'
# Keep 'all' here: the document patterns above are written to give both the number with
# and without its sheet number, and 'longest' would discard the shorter one
fileAliasSelection: all
targetViewFilterValues: []
entityViewSearchProperty: name
entityViewFilterValues: []  
# Optional scope for the submit/collect matcher (fn_dm_context_entity_matching): entities are
# only matched to targets with the same primary (and secondary, when set). Targets tagged
# 'ScopeWideDetect' join every secondary of their primary. Entities with no scope value
# are matched against all targets. Both properties must exist on entity and target views.
# Leave empty to match unscoped.
primaryScopeProperty: ''
secondaryScopeProperty: ''

workflow: wf_ctx_entity_matching
# Cron schedule for the workflow. The default only fires on 29 February, which leaves runs
# to be started by hand; set e.g. '0 2 * * *' for a nightly run.
workflowSchedule: '0 0 29 2 *'
### UPDATE THE FOLLOWING VALUES FOR YOUR IDP CONFIGURATION ###
workflowClientId: ${IDP_CLIENT_ID}
workflowClientSecret: ${IDP_CLIENT_SECRET}
# Update GROUP_SOURCE_ID to your group source ID
entity_matching_processing_group_source_id: ${GROUP_SOURCE_ID}
