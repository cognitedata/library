# Service principal that runs the entity matching workflow and its functions
name: 'gp_entity_matching_processing'
sourceId: '{{entity_matching_processing_group_source_id}}'
metadata:
  origin: 'cdf-project-templates'
capabilities:
  - sessionsAcl:
      actions:
        - LIST
        - CREATE
        - DELETE
      scope:
        all: {}
  - extractionConfigsAcl:
      actions:
        - READ
        - WRITE
      scope:
        all: {}
  - extractionRunsAcl:
      actions:
        - READ
        - WRITE
      scope:
        all: {}
  # State store, good/bad results and manual/rule input tables
  - rawAcl:
      actions:
        - READ
        - WRITE
      scope:
        tableScope:
          dbsToTables:
            {{ dbName }}: []
  # Views are read, never written
  - dataModelsAcl:
      actions:
        - READ
      scope:
        all: {}
  - dataModelInstancesAcl:
      actions:
        - READ
        - WRITE
      scope:
        all: {}
  # Resolves dataSetExternalId for the files below
  - datasetsAcl:
      actions:
        - READ
      scope:
        all: {}
  # The target content read from the data model is cached as a JSON file, so an
  # unchanged target set is not read again on the next run.
  - filesAcl:
      actions:
        - READ
        - WRITE
      scope:
        all: {}
  - entitymatchingAcl:
      actions:
        - READ
        - WRITE
      scope:
        all: {}
  - functionsAcl:
      actions:
        - READ
        - WRITE
      scope:
        all: {}
