# Service principal that runs the entity matching workflow and its functions
name: 'gp_entity_matching_processing'
sourceId: '{{entity_matching_processing_group_source_id}}'
metadata:
  origin: 'cdf-project-templates'
capabilities:
  - sessionsAcl:
      actions:
        - LIST
        - CREATE
        - DELETE
      scope:
        all: {}
  - extractionConfigsAcl:
      actions:
        - READ
      scope:
        all: {}
  - extractionRunsAcl:
      actions:
        - READ
        - WRITE
      scope:
        all: {}
  # State store, good/bad results and manual/rule input tables
  - rawAcl:
      actions:
        - READ
        - WRITE
      scope:
        tableScope:
          dbsToTables:
            {{ dbName }}: []
  # Views are read, never written
  - dataModelsAcl:
      actions:
        - READ
      scope:
        all: {}
  - dataModelInstancesAcl:
      actions:
        - READ
        - WRITE
      scope:
        all: {}
  # Resolves dataSetExternalId for the files below
  - datasetsAcl:
      actions:
        - READ
      scope:
        all: {}
  # Staging and the target cache live in this data set. Scope WRITE so a broader
  # filesAcl on other data sets cannot overwrite those files; collect also checks
  # a digest stored in RAW.
  - filesAcl:
      actions:
        - READ
        - WRITE
      scope:
        datasetScope:
          ids:
            - ds_entity_matching
  - entitymatchingAcl:
      actions:
        - READ
        - WRITE
      scope:
        all: {}
  - functionsAcl:
      actions:
        - READ
        - WRITE
      scope:
        all: {}
