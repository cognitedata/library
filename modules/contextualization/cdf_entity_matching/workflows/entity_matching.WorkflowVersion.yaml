workflowExternalId: {{ workflow }}
version: 'v1'
workflowDefinition:
  description: 'Workflow for entity matching'
  tasks:
    - externalId: 'fn_dm_context_aliases_update'
      type: 'function'
      parameters:
        function:
          externalId: 'fn_dm_context_aliases_update'
          data:
            {
              "ExtractionPipelineExtId": "ep_ctx_aliases_update",
              "logLevel": "INFO",
            }
      name: 'Aliases update'
      description: 'Update aliases for timeseries and assets as prep for entity matching'
      retries: 3
      timeout: 1200
      onFailure: 'abortWorkflow'
    # Not retried: a retry after a partial run would queue a second predict job for the
    # same entities. A failed submit is picked up again by the next run of this workflow.
    - externalId: 'fn_dm_context_entity_matching_submit'
      type: 'function'
      parameters:
        function:
          externalId: 'fn_dm_context_entity_matching'
          data:
            {
              "stage": "submit",
              "logLevel": "INFO",
              "ExtractionPipelineExtId": "ep_ctx_entity_matching",
            }
      name: 'Entity matching submit'
      description: 'Manual and rule based matching, then start the entity matching predict job'
      retries: 0
      timeout: 1200
      onFailure: 'abortWorkflow'
      dependsOn:
        - externalId: 'fn_dm_context_aliases_update'
    # Collects the jobs submit started. A job that is still running when this task's poll
    # budget is spent stays queued and is picked up by the next run of this workflow.
    - externalId: 'fn_dm_context_entity_matching_collect'
      type: 'function'
      parameters:
        function:
          externalId: 'fn_dm_context_entity_matching'
          data:
            {
              "stage": "collect",
              "logLevel": "INFO",
              "ExtractionPipelineExtId": "ep_ctx_entity_matching",
            }
      name: 'Entity matching collect'
      description: 'Poll queued predict jobs in parallel and write matches to RAW and the data model'
      retries: 3
      timeout: 1200
      onFailure: 'abortWorkflow'
      dependsOn:
        - externalId: 'fn_dm_context_entity_matching_submit'
