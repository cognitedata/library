space: "{{ scopeSchemaSpace }}"
externalId: Asset
name: Asset
description: >
  CogniteAsset extended with test-only site and unit properties for scoped file annotation.
  The filter keeps every CogniteAsset instance visible before scope values are written.
implements:
  - space: cdf_cdm
    externalId: CogniteAsset
    version: v1
    type: view
version: "{{ scopeDmVersion }}"
filter:
  hasData:
    - type: container
      space: cdf_cdm
      externalId: CogniteAsset
properties:
  site:
    name: Site
    description: Primary matching scope (site or facility). Example value - VAL from VAL_23-KA-9101.
    container:
      space: "{{ scopeSchemaSpace }}"
      externalId: AssetScope
      type: container
    containerPropertyIdentifier: site
  unit:
    name: Unit
    description: Secondary matching scope within the site. Example value - 23 from VAL_23-KA-9101.
    container:
      space: "{{ scopeSchemaSpace }}"
      externalId: AssetScope
      type: container
    containerPropertyIdentifier: unit
