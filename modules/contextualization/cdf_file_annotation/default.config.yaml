# used in /data_sets, /data_models, /functions, /extraction_pipelines, and /workflows
annotationDatasetExternalId: ds_file_annotation

# used in /data_models and /extraction_pipelines
annotationStateExternalId: FileAnnotationState
annotationStateSchemaSpace: sp_hdm #NOTE: stands for space helper data model
annotationStateVersion: v1.0.0
patternModeInstanceSpace: sp_dat_pattern_mode_results
patternDetectSink: pattern_detection_sink_node
fileSchemaSpace: cdf_cdm
# Instance spaces. Leave fileInstanceSpace / targetEntityInstanceSpace empty ("") to annotate
# files from several instance spaces with one configuration: each file is then matched only
# against assets and files in its own space, and its annotation state is stored next to it.
# See README "Multiple instance spaces in one configuration". Example:
#   fileInstanceSpace: ""          # files from inst_plant_a, inst_plant_b, ...
#   targetEntityInstanceSpace: ""  # assets from the same space as each file
fileInstanceSpace: sp_cdm_instances
fileExternalId: CogniteFile
fileVersion: v1
fileSearchProperty: aliases
fileResourceProperty: ""
targetEntitySchemaSpace: cdf_cdm
targetEntityInstanceSpace: sp_cdm_instances
targetEntityExternalId: CogniteAsset
targetEntityVersion: v1
targetEntitySearchProperty: aliases
targetEntityResourceProperty: ""

# used in /raw and /extraction_pipelines
rawDb: db_file_annotation
rawTableDocTag: annotation_documents_tags
rawTableDocDoc: annotation_documents_docs
rawTableDocPattern: annotation_documents_patterns
rawTableCache: annotation_entities_cache
rawManualPatternsCatalog: manual_patterns_catalog
rawTablePromoteCache: annotation_tags_cache
rawTableAnnotationStatusReport: annotation_file_status_report

# used in /extraction_pipelines
extractionPipelineExternalId: ep_ctx_file_annotation
patternMode: true
structuralAutoPatterns: true
cleanOldAnnotations: false
# Regular-detect thresholds. assetAuto* apply to asset links (diagrams.AssetLink);
# fileAuto* apply to file links (diagrams.FileLink).
assetAutoApprovalThreshold: 0.85
assetAutoSuggestThreshold: 0.7
fileAutoApprovalThreshold: 0.25
fileAutoSuggestThreshold: 0.2
# Scope properties are property NAMES (for example site / unit), not values. The property must
# be a text property with the same name on both the file view and the target entity view; the
# site value is read from each instance. Empty disables that grouping level. See README
# "Scoping by site". Example:
#   primaryScopeProperty: site
#   secondaryScopeProperty: unit
primaryScopeProperty: ""
secondaryScopeProperty: ""
# Tag filters for Prepare (files to process) and Launch (match entities).
# Pipeline tags: ToAnnotate, DetectInDiagrams, ScopeWideDetect, AnnotationInProcess,
# Annotated, AnnotationFailed, PromoteAttempted, PromotedAuto, AmbiguousMatch.
# Prepare IN filter. Add Annotated / AnnotationFailed here to reprocess those files
# (they are then dropped from the exclude list automatically).
filesToAnnotateTags:
  - ToAnnotate
# Prepare NOT IN filter. Keep AnnotationInProcess unless you intend to pick up in-flight files.
filesToAnnotateExcludeTags:
  - AnnotationInProcess
  - Annotated
  - AnnotationFailed
# Launch: files used as diagram-detect match entities (IN).
fileEntitiesTags:
  - DetectInDiagrams
# Launch: assets used as diagram-detect match entities (IN).
targetEntitiesTags:
  - DetectInDiagrams
# Debugging: externalId of one file (in fileInstanceSpace) to run through all stages.
# Other files are neither retrieved nor processed, and the file's tags are ignored
# (it is re-annotated even if already Annotated). Leave empty for normal runs.
debugFileExternalId: ""
# Separate normalize pattern lists for assets vs files (avoids false-positive
# structural samples when alias shapes differ). Capture groups joined by "_";
# longest match kept. Empty list ([]) disables filtering for that source.
# Casing is preserved (DMS alias match is case-sensitive).
# Toolkit substitutes variables as a regex replacement, so prefer character classes
# over backslash escapes ([0-9] rather than \d).
# entityNormalizationPatterns: []
# fileNormalizationPatterns: []
entityNormalizationPatterns:
  - '([A-Z]{2,4}[-_.:][0-9]{4,5})'
  - '([0-9]{2}[-_.:][A-Z]{2,4}[-_.:][0-9]{4,5}[A-Z][-_][A-Z]{1,3})'
  - '([0-9]{2}[-_.:][A-Z]{2,4}[-_.:][0-9]{4,5}[-_][A-Z]{1,3})'
  - '([0-9]{2}[-_.:][A-Z]{2,4}[-_.:][0-9]{4,5})'
fileNormalizationPatterns:
  - '(?<![A-Z])([A-Z]{2,4}[-_][A-Z0-9]+[-_][A-Z][-_][0-9]+[-_][0-9]+)'
  - '(?<![A-Z])([A-Z]{2,4}[-_][A-Z0-9]+[-_][A-Z][-_][0-9]+)(?=[-_][0-9]+)'

# used in /functions
functionClientId: ${IDP_CLIENT_ID}
functionClientSecret: ${IDP_CLIENT_SECRET}
functionSpace: sp_file_annotation_fn # space where function code nodes are stored — created by this module
functionExternalId: fn_file_annotation
functionVersion: v1.0.0

# used in /workflows
workflowExternalId: wf_ctx_file_annotation
workflowSchedule: "0 0 29 2 *"

# used in /transformations
fileToAssetTransformationExternalId: tr_file_to_asset_from_annotations
fileAnnotationStatusReportTransformationExternalId: tr_file_annotation_status_report
tagAssetsDetectInDiagramsTransformationExternalId: tr_tag_assets_detect_in_diagrams
tagFilesDetectInDiagramsTransformationExternalId: tr_tag_files_detect_in_diagrams
tagFilesToAnnotateTransformationExternalId: tr_tag_files_to_annotate

# used in /auth
# Update GROUP_SOURCE_ID to your group source ID
groupSourceId: ${GROUP_SOURCE_ID}
ApplicationOwner: <APPLICATION_OWNER> # Update to your application owner email id(s)
