externalId: {{ extractionPipelineExternalId }}
config:
  parameters:
    # Debug file external id for the extraction pipeline, empty string for no debug file.
    debugFileExternalId: {{ debugFileExternalId }}
    patternMode: {{ patternMode }}
    structuralAutoPatterns: {{ structuralAutoPatterns }}
    cleanOldAnnotations: {{ cleanOldAnnotations }}
    assetAutoApprovalThreshold: {{ assetAutoApprovalThreshold }}
    assetAutoSuggestThreshold: {{ assetAutoSuggestThreshold }}
    fileAutoApprovalThreshold: {{ fileAutoApprovalThreshold }}
    fileAutoSuggestThreshold: {{ fileAutoSuggestThreshold }}
    # Scope properties are property NAMES, not values. Set them in default.config.yaml
    # (primaryScopeProperty / secondaryScopeProperty). Each value comes from the instances:
    # the property must be a text property with the same name on both fileView and
    # targetEntitiesView. Launch groups files by their value and matches each group only
    # against assets/files with the same value. Empty string disables scoping.
    # Example: primaryScopeProperty: site, secondaryScopeProperty: unit
    #   A file with site = "PlantA", unit = "U100" is matched only against DetectInDiagrams
    #   assets/files with site = "PlantA" and unit = "U100", plus ScopeWideDetect ones in "PlantA".
    primaryScopeProperty: {{ primaryScopeProperty }}
    secondaryScopeProperty: {{ secondaryScopeProperty }}
    # Pipeline tags: ToAnnotate, DetectInDiagrams, ScopeWideDetect, AnnotationInProcess,
    # Annotated, AnnotationFailed, PromoteAttempted, PromotedAuto, AmbiguousMatch.
    filesToAnnotateTags: {{ filesToAnnotateTags }}
    filesToAnnotateExcludeTags: {{ filesToAnnotateExcludeTags }}
    fileEntitiesTags: {{ fileEntitiesTags }}
    targetEntitiesTags: {{ targetEntitiesTags }}
    
    rawDb: {{ rawDb }}
    rawTableDocTag: {{ rawTableDocTag }}
    rawTableDocDoc: {{ rawTableDocDoc }}
    rawTableDocPattern: {{ rawTableDocPattern }}
    rawTableCache: {{ rawTableCache }}
    rawManualPatternsCatalog: {{ rawManualPatternsCatalog }}
    rawTablePromoteCache: {{ rawTablePromoteCache }}
    patternPromote:
      textNormalization:
        # Separate lists avoid false-positive structural samples when asset vs file
        # alias shapes differ. Capture-group semantics as aliases_update aliasPattern;
        # longest match kept. Empty list disables filtering for that source.
        # Casing is preserved — DMS alias IN filters are case-sensitive.
        entityNormalizationPatterns: {{ entityNormalizationPatterns }}
        fileNormalizationPatterns: {{ fileNormalizationPatterns }}
  data:
    # instanceSpace: a set value limits the view to that one space. An empty value means
    # "the space of the file being annotated": Prepare picks up files from every space, Launch
    # and Promote match each file only against entities in its own space, and the annotation
    # state is stored next to the file. Example with sites in separate spaces:
    #   fileView.instanceSpace: (empty), targetEntitiesView.instanceSpace: (empty)
    #   A file in inst_plant_a is matched only against assets and files in inst_plant_a.
    fileView:
      schemaSpace: {{ fileSchemaSpace }}
      instanceSpace: {{ fileInstanceSpace }}
      externalId: {{ fileExternalId }}
      version: {{ fileVersion }}
      searchProperty: {{ fileSearchProperty }}
      resourceProperty: {{ fileResourceProperty }}
    targetEntitiesView:
      schemaSpace: {{ targetEntitySchemaSpace }}
      instanceSpace: {{ targetEntityInstanceSpace }}
      externalId: {{ targetEntityExternalId }}
      version: {{ targetEntityVersion }}
      searchProperty: {{ targetEntitySearchProperty }}
      resourceProperty: {{ targetEntityResourceProperty }}
    annotationStateView:
      schemaSpace: {{ annotationStateSchemaSpace }}
      instanceSpace: {{ fileInstanceSpace }}
      externalId: {{ annotationStateExternalId }}
      version: {{ annotationStateVersion }}
    sinkNode:
      space: {{ patternModeInstanceSpace }}
      externalId: {{ patternDetectSink }}
