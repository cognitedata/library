name: 'ctx:file:annotation'
externalId: {{ extractionPipelineExternalId }}
dataSetExternalId: {{ annotationDatasetExternalId }}
description: "Pipeline holding configuration and run history for file annotation."
rawTables:
  - dbName: {{ rawDb }}
    tableName: {{ rawTableDocTag }}
  - dbName: {{ rawDb }}
    tableName: {{ rawTableDocDoc }}
  - dbName: {{ rawDb }}
    tableName: {{ rawTableDocPattern }}
  - dbName: {{ rawDb }}
    tableName: {{ rawTableCache }}
  - dbName: {{ rawDb }}
    tableName: {{ rawManualPatternsCatalog }}
  - dbName: {{ rawDb }}
    tableName: {{ rawTablePromoteCache }}
  - dbName: {{ rawDb }}
    tableName: {{ rawTableAnnotationStatusReport }}
source: "Files"
documentation: >
  ## File annotation

  The `fn_file_annotation` function runs four stages selected by its input `stage`:
  prepare, launch, finalize, and promote. One workflow runs those stages in order and
  then runs the file-to-asset transformation.

  The extraction-pipeline config uses `parameters` for operator choices, RAW table
  names, and `data` for view identities and matching properties. Fixed limits, tags,
  state filters, and promote cleanup behavior are constants in the function code.

  See `detailed_guides/CONFIG.md` in the deployment pack for the complete contract.
