name: Build and Release Packages

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --group dev

    - name: Lint with ruff
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0

    - name: Type check with pyright
      uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef # v3.0.2

    - name: Run tests
      env:
        PYTHONPATH: .
      run: |
        uv run pytest tests/ -q
        uv run pytest modules/contextualization/cdf_entity_matching/tests/ --rootdir=. -q
        uv run pytest modules/contextualization/cdf_p_and_id_annotation/functions/fn_dm_context_files_annotation/ --rootdir=. -q

    - name: Validate packages.toml
      run: |
        python validate_packages.py

    - name: Build packages
      run: python build_packages.py

    - name: Upload packages artifact
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: packages
        path: packages.zip

    - name: Create/Update Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: latest
        name: Latest Release
        body: |
          ## Latest Packages Release

          **Download:** [packages.zip](https://github.com/${{ github.repository }}/releases/download/latest/packages.zip)

          This release is automatically updated on every merge to main.
        files: |
          packages.zip
        draft: false
        prerelease: false
